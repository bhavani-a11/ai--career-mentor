
services:
  - type: web
    name: ai-career-mentor-backend
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && gunicorn -w 4 -k uvicorn.workers.UvicornWorker app.main:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-career-mentor-db
          property: connectionString
      - key: GITHUB_TOKEN
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://ai-career-mentor-frontend.onrender.com,http://localhost:5173,http://localhost:5174"

  - type: web
    name: ai-career-mentor-frontend
    runtime: static
    plan: free
    autoDeploy: true
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: ai-career-mentor-backend
          type: web
          property: host

databases:
  - name: ai-career-mentor-db
    databaseName: ai_career_mentor
    user: ai_career_mentor
    plan: free
